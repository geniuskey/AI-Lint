<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>AI-Lint 설정</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; padding: 40px 16px;
        background: linear-gradient(180deg, #eef4fb, #f8fafc 240px);
        font: 14px/1.6 -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; color: #0f172a;
      }
      .card {
        position: relative; overflow: hidden;
        max-width: 520px; margin: 0 auto; padding: 26px 28px 28px;
        background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      /* 로고의 파랑과 앰버. 확장·데스크톱·문서가 같은 띠를 쓴다. */
      .card::before {
        content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px;
        background: linear-gradient(90deg, #5b9ae0, #2a5da2 55%, #fbbf24);
      }
      h1 { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; font-size: 17px; letter-spacing: -0.01em; }
      h1 img { width: 26px; height: 26px; border-radius: 7px; }
      .lead { margin: 0 0 20px; color: #64748b; font-size: 12px; }
      label { display: block; margin: 16px 0 5px; font-weight: 600; font-size: 12px; color: #334155; }
      input[type='text'], input[type='password'], select {
        width: 100%; padding: 9px 11px; box-sizing: border-box;
        border: 1px solid #cbd5e1; border-radius: 8px; background: #fff;
        font: inherit; color: inherit;
      }
      input:focus, select:focus {
        outline: none; border-color: #5b9ae0; box-shadow: 0 0 0 3px rgba(91, 154, 224, 0.22);
      }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
      .row label { margin: 0; font-weight: 400; font-size: 13px; color: #0f172a; }
      .row input { width: 15px; height: 15px; accent-color: #2a5da2; }
      .actions { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
      button {
        padding: 9px 22px; border: none; border-radius: 8px;
        background: linear-gradient(135deg, #5b9ae0, #2a5da2); color: #fff;
        font: 600 13px/1 inherit; cursor: pointer;
      }
      button:hover { box-shadow: 0 6px 16px rgba(42, 93, 162, 0.32); }
      #status { color: #15803d; font-size: 12px; font-weight: 600; }
      .hint { color: #64748b; font-size: 12px; margin: 5px 0 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><img src="icons/48.png" alt="" />AI-Lint 설정</h1>
      <p class="lead">사내 백엔드 주소와 토큰을 넣으면 Confluence 페이지에서 검사 버튼이 동작합니다.</p>
      <label for="backendUrl">백엔드 주소</label>
      <input id="backendUrl" type="text" placeholder="https://ai-lint.example.com" />
      <label for="serviceToken">서비스 토큰</label>
      <input id="serviceToken" type="password" />
      <label for="userId">사용자 ID</label>
      <input id="userId" type="text" placeholder="사번 또는 계정" />
      <p class="hint">LLM 호출량을 사용자별로 집계할 때 씁니다.</p>
      <label for="rulesetId">규칙셋</label>
      <select id="rulesetId"></select>
      <div class="row"><input id="useLlm" type="checkbox" /><label for="useLlm">AI 맥락 검사 사용</label></div>
      <div class="row"><input id="autoRun" type="checkbox" /><label for="autoRun">페이지를 열면 자동 검사</label></div>
      <div class="actions"><button id="save">저장</button><span id="status"></span></div>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
